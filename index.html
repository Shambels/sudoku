<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#050705">
  <link rel="stylesheet" href="style.css">
  <title>Sudoku</title>
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <path d="M9 3v18M15 3v18M3 9h18M3 15h18"></path>
        </svg>
      </span>
      <h1>Sudoku</h1>
    </div>
    <p class="tagline">Type the clues, or drop a photo of the puzzle.</p>
  </header>

  <main>
    <section id="import" class="toolbar" aria-label="Import">
      <div class="actions">
        <button id="photoBtn" type="button" class="btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M4 7h3l2-3h6l2 3h3v12H4z"></path>
            <circle cx="12" cy="13" r="3.5"></circle>
          </svg>
          Read from a photo
        </button>
        <input type="file" id="photo" accept="image/*" capture="environment" hidden>
        <button id="cornersBtn" type="button" class="btn" hidden>Set corners by hand</button>
        <button id="clearBtn" type="button" class="btn btn-quiet">Clear</button>
      </div>
      <p id="importStatus" class="status" role="status">Pick a photo, drop one anywhere on the page, or paste one.</p>
    </section>

    <details id="previewWrap" class="card preview" hidden open>
      <summary class="preview-head">
        <span class="panel-title">Photo</span>
        <span id="previewHint" class="preview-hint"></span>
        <svg class="chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M6 9l6 6 6-6"></path>
        </svg>
      </summary>
      <div class="preview-body">
        <figure id="pickerFigure" hidden>
          <canvas id="picker" title="click the four corners of the grid"></canvas>
          <figcaption>Your photo — click the corners in order</figcaption>
        </figure>
        <figure id="previewFigure" hidden>
          <canvas id="preview" title="the grid as the reader rectified it"></canvas>
          <figcaption>What the reader saw</figcaption>
        </figure>
      </div>
    </details>

    <section id="container" class="boards">
      <div class="board-panel">
        <div class="panel-head">
          <h2 class="panel-title">Puzzle</h2>
          <button id="copyPuzzle" type="button" class="btn btn-icon" title="Copy the clues as an 81-character string" aria-label="Copy the clues">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" class="icon-copy">
              <rect x="9" y="9" width="11" height="11" rx="2"></rect>
              <path d="M5 15V5a1 1 0 0 1 1-1h10"></path>
            </svg>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true" class="icon-check">
              <path d="M5 12l5 5L20 7"></path>
            </svg>
          </button>
        </div>
        <div class="board-frame" id="problemFrame">
          <div id="problem" class="board" role="grid" aria-label="Puzzle clues">
            <input class="case c1" type="text" inputmode="numeric" pattern="[1-9]" maxlength="1" autocomplete="off" aria-label="Row 1, column 1">
            <input class="case c2" type="text" inputmode="numeric" pattern="[1-9]" maxlength="1" autocomplete="off" aria-label="Row 1, column 2">
            <input class="case c3 x3" type="text" inputmode="numeric" pattern="[1-9]" maxlength="1" autocomplete="off" aria-label="Row 1, column 3">

        </div>

          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6"></path>
          </svg>
        </button>
      </div>

      <div class="board-panel" id="solutionPanel" hidden>
        <div class="panel-head">
          <h2 class="panel-title">Solution</h2>
          <button id="copySolution" type="button" class="btn btn-icon" title="Copy the solution as an 81-character string" aria-label="Copy the solution">
